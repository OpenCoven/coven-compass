name: Secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sh scripts/with-gitleaks.sh python3 scripts/scan-secrets.py history
      - run: sh scripts/with-gitleaks.sh python3 tests/secret-checks.py -v
