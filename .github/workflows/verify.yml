name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime versions
        run: node --version && python3 --version
      - name: verify-all --check (site, source, tests, crown, evidence)
        run: node scripts/verify-all.mjs --check --report "$RUNNER_TEMP/verify-report.json"
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: ${{ runner.temp }}/verify-report.json
          if-no-files-found: warn
